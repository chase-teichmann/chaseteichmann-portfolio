name: Checks

# Runs on every pull request: the site must build and the booking Worker's tests must pass.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: test "$(cat dist/CNAME)" = "chaseteichmann.com" && test -f dist/og.png && test -f dist/sw.js
      # Standing rule: the fish subdomain never appears on the personal site.
      - run: '! grep -rq "fish.chaseteichmann" dist'
  booking:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booking/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist
